name: ci

# Proves the current state on every push and every PR:
# install -> TypeScript compile -> VSIX package.
# This repo has no test suite (package.json has no `test` script),
# so compile + package green is the merge gate.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run compile

      - name: Package VSIX (also validates the marketplace manifest)
        run: npm run package

      - uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: "*.vsix"
